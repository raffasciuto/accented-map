[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # These are real secrets, correctly handled -- read via process.env in netlify/functions/*.js,
  # never hardcoded, and .env (which holds the actual local values) has never been committed
  # (confirmed via `git log --all --full-history -- "*.env*"`, empty). Netlify's secrets scanner
  # was still failing the build over their configured values, hence the explicit omit.
  SECRETS_SCAN_OMIT_KEYS = "APP_SHARED_SECRET,GROQ_API_KEY,HF_TOKEN"
